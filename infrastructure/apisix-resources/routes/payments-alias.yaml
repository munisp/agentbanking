# payments-alias — frontend-prefix alias (wave-7)
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: 54agent-payments-alias-route
  namespace: 54agent
spec:
  ingressClassName: apisix
  http:
    - name: rule-1
      priority: 10
      match:
        hosts:
          - 54agent.upi.dev
          - api.54agent.io
        paths:
          - /payments
          - /payments/*
      backends:
        - serviceName: core-payments
          servicePort: 9357
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri:
              - "^/payments/?$"
              - "/api/v1/transactions"
              - "^/payments/list/?$"
              - "/api/v1/transactions"
              - "^/payments/initiate/?$"
              - "/api/v1/transactions"
              - "^/payments/(.*)"
              - "/api/v1/transactions/$1"
        - name: cors
          enable: true
          config:
            allow_origins: "*"
            allow_methods: "*"
            allow_headers: "*"
            expose_headers: "*"
