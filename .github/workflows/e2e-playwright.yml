# ─────────────────────────────────────────────────────────────────────────────
# POS-54Link — Playwright E2E Test Pipeline
# Spins up postgres/redis services, pushes the DB schema, builds and starts the
# app, then runs the Playwright suite against it.
#
# round3-W2 (2026-08) — honest wiring notes:
# * The Node app is services/api-server-ts (only dir with package.json +
#   pnpm-lock.yaml). All pnpm steps run there; pnpm is pinned explicitly.
# * The repo-root playwright.config.ts testDir is fixed (./e2e → ./tests/e2e)
#   in this branch; the workflow runs the stock config via the app's playwright.
# * services/api-server-ts currently has no client/ tree, so the build falls
#   back to the server-only bundle. UI-driven specs require the web client to
#   be co-located again (serveStatic serves no SPA otherwise) — until then
#   those specs will fail for real, and this job is NOT artificially gated.
# ─────────────────────────────────────────────────────────────────────────────
name: E2E Playwright Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  APP_DIR: services/api-server-ts

permissions:
  contents: read

jobs:
  e2e-tests:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pos54link
          POSTGRES_PASSWORD: pos54link_e2e_pass
          POSTGRES_DB: pos54link_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pos54link"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_URL: postgresql://pos54link:pos54link_e2e_pass@localhost:5432/pos54link_e2e
      DATABASE_URL: postgresql://pos54link:pos54link_e2e_pass@localhost:5432/pos54link_e2e
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: e2e-test-jwt-secret-do-not-use-in-production
      VITE_APP_ID: e2e-test-app
      OAUTH_SERVER_URL: http://localhost:8080
      VITE_OAUTH_PORTAL_URL: http://localhost:8080/login
      OWNER_OPEN_ID: e2e-owner-id
      OWNER_NAME: E2E Test Owner
      BUILT_IN_FORGE_API_URL: http://localhost:3001/api
      BUILT_IN_FORGE_API_KEY: e2e-forge-key
      VITE_FRONTEND_FORGE_API_KEY: e2e-frontend-forge-key
      VITE_FRONTEND_FORGE_API_URL: http://localhost:3001/api
      NODE_ENV: test
      # The whole suite drives the app from one runner IP; the server exposes
      # this documented opt-out so limiters don't 429 the suite mid-run.
      DISABLE_RATE_LIMITS: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # cache: pnpm + cache-dependency-path disabled until the lockfile is restored

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: pnpm install --no-frozen-lockfile  # lockfile restore pending — staged artifact for maintainers

      - name: Install Playwright browsers
        working-directory: ${{ env.APP_DIR }}
        run: pnpm exec playwright install --with-deps chromium

      - name: Push database schema
        working-directory: ${{ env.APP_DIR }}
        run: pnpm db:push
        env:
          POSTGRES_URL: ${{ env.POSTGRES_URL }}

      - name: Seed database
        # scripts/seed-comprehensive.mjs imports only Node builtins (crypto/fs)
        # and writes data/seed-comprehensive.json — it runs from the repo root.
        run: node scripts/seed-comprehensive.mjs
        env:
          POSTGRES_URL: ${{ env.POSTGRES_URL }}

      - name: Build application
        working-directory: ${{ env.APP_DIR }}
        run: |
          if [ -d client ]; then
            pnpm build
          else
            echo "client/ not present — building server bundle only (pnpm build:server)"
            pnpm build:server
          fi

      - name: Start application server
        run: |
          node ${{ env.APP_DIR }}/dist/index.js &
          echo "Waiting for server to start..."
          for i in $(seq 1 30); do
            if curl -s http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "Server is ready!"
              break
            fi
            echo "Attempt $i/30 - waiting..."
            sleep 2
          done

      - name: Run Playwright E2E tests
        # Uses the repo-root playwright.config.ts (testDir fixed to ./tests/e2e).
        # The playwright binary + @playwright/test resolve from the app install
        # in services/api-server-ts; specs import only @playwright/test.
        run: ${{ env.APP_DIR }}/node_modules/.bin/playwright test
        env:
          BASE_URL: http://localhost:3000

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-${{ github.sha }}
          path: playwright-report/
          retention-days: 14

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ github.sha }}
          path: test-results/
          retention-days: 7

      - name: Post test summary
        if: always()
        run: |
          echo "## E2E Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f playwright-report/index.html ]; then
            echo "✅ Playwright report generated successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ No Playwright report found" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
