# reports-alias — wave-7b frontend-prefix alias
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: 54agent-reports-alias-route
  namespace: 54agent
spec:
  ingressClassName: apisix
  http:
    - name: rule-1
      priority: 10
      match:
        hosts:
          - 54agent.upi.dev
          - api.54agent.io
        paths:
          - /reports
          - /reports/*
      backends:
        - serviceName: analytics-data
          servicePort: 9177
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri:
              - "^/reports/?(.*)"
              - "/api/v1/reports/$1"
        - name: cors
          enable: true
          config:
            allow_origins: "*"
            allow_methods: "*"
            allow_headers: "*"
            expose_headers: "*"
