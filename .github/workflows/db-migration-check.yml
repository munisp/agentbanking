# Item 9: Database migration validation in CI
# round3-W2 (2026-08): re-rooted to services/api-server-ts (the only directory
# with package.json + pnpm-lock.yaml + drizzle.config.ts after the 2026-06-29
# restructure); pnpm pinned explicitly; path filters extended to the new tree.
name: DB Migration Check

on:
  pull_request:
    paths:
      - 'drizzle/**'
      - 'db/**'
      - 'server/db/**'
      - 'services/api-server-ts/drizzle/**'

env:
  NODE_VERSION: 22
  APP_DIR: services/api-server-ts

jobs:
  migration-check:
    name: Validate DB Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pos_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # cache: pnpm + cache-dependency-path disabled until the lockfile is restored

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: pnpm install --no-frozen-lockfile  # lockfile restore pending — staged artifact for maintainers

      - name: Run schema push (dry-run validation)
        working-directory: ${{ env.APP_DIR }}
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pos_migration_test
          POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/pos_migration_test
        run: |
          echo "Validating Drizzle schema can be pushed..."
          pnpm db:push 2>&1
          echo "Schema push successful — migrations are valid"

      - name: Check for uncommitted schema changes
        run: |
          if [ -n "$(git diff --name-only -- drizzle/ services/api-server-ts/drizzle/)" ]; then
            echo "::error::Uncommitted schema changes detected. Run 'pnpm db:generate' and commit."
            git diff -- drizzle/ services/api-server-ts/drizzle/
            exit 1
          fi
          echo "No uncommitted schema changes"
