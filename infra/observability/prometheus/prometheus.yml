# =============================================================================
# AgentBanking / POS54 — Canonical Prometheus configuration
# Scrapes ONLY the observability stack itself plus the aggregated collector
# feed (:8889). Middleware targets are scraped inside the otel-collector
# (see infra/observability/otel/otel-collector-config.yaml).
# =============================================================================

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    cluster: pos54
    source: otel-stack

rule_files:
  - '/etc/prometheus/rules/*.yml'

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: otel-collector
    # Aggregated middleware + spanmetrics feed (namespace pos54_*)
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: tempo
    metrics_path: /metrics
    static_configs:
      - targets: ['tempo:3200']

  - job_name: alertmanager
    static_configs:
      - targets: ['alertmanager:9093']

  - job_name: grafana
    metrics_path: /metrics
    static_configs:
      - targets: ['grafana:3000']

  - job_name: loki
    metrics_path: /metrics
    static_configs:
      - targets: ['loki:3100']

  - job_name: pos-shell-app
    # TS api-server (prom-client) — also scraped via the collector; this direct
    # job keeps platform `up{}` coverage inside Prometheus itself.
    metrics_path: /api/metrics
    static_configs:
      - targets: ['app:3000']
