replicaCount: 1
image:
  repository: registry.digitalocean.com/talentgraph-auth/54agent-open-banking-api
  pullPolicy: IfNotPresent
  tag: "0.0.13"
nameOverride: ""
fullnameOverride: ""
serviceAccount:
  create: false
  name: 54agent
podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}
service:
  type: ClusterIP
  ports:
    - port: 9528
    - port: 9529
    - port: 9530
    - port: 9531
    - port: 9532
    - port: 9533
    - port: 9534
    - port: 9535
    - port: 9536
    - port: 9537
    - port: 9538
resources:
  requests:
    cpu: 200m
    memory: 176Mi
  limits:
    ephemeral-storage: 512Mi
    cpu: 1000m
    memory: 704Mi
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}
dapr:
  appId: open-banking-api
  appPort: 9528
  enableMetrics: true
  enabled: true
  metricsPort: 9099
  sidecarListenAddresses: "0.0.0.0"
  cpu-request: 100m
  cpu-limit: 300m
  memory-request: 250Mi
  memory-limit: 1000Mi
secrets:
  APP_PORT: "9528"
  PORT_BASE: "9528"
  SERVICE_GROUP: open-banking-api
  SERVICES: "admin-service,admin-services,api-gateway,api-server-ts,apisix-gateway,developer-portal-service,embedded-finance-anaas,gateway-service,management-api,unified-api,white-label-api"
  # Secrets below are intentionally empty (fail-closed).
  # Set them at deploy time via --set secrets.<KEY>=... or an external, uncommitted values file.
  # templates/secret.yaml enforces non-empty values via required().
  JWT_SECRET: ""  # REQUIRED: no default committed
  CRON_SECRET: ""  # REQUIRED: no default committed
  INTERNAL_API_KEY: ""  # REQUIRED: no default committed
  TX_SIGNING_SECRET: ""  # REQUIRED: no default committed
  KEYCLOAK_CLIENT_SECRET: ""  # REQUIRED: no default committed
  PLATFORM_API_KEY: ""  # REQUIRED: no default committed
  PLATFORM_SERVICE_TOKEN: ""  # REQUIRED: no default committed
  MINIO_SECRET_KEY: ""  # REQUIRED: no default committed
  APISIX_ADMIN_KEY: ""  # REQUIRED: no default committed
  TERMII_API_KEY: ""  # REQUIRED: no default committed
  FLUVIO_API_KEY: ""  # REQUIRED: no default committed
  MQTT_PASSWORD: ""  # REQUIRED: no default committed
  MINIO_ACCESS_KEY: ""  # REQUIRED: no default committed
  NODE_ENV: "production"
  # NF-SEC-5: never fail open on security checks in production
  SECURITY_FAIL_OPEN: "false"
