[package]
name = "ledger-integrity-validator"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = "0.4"
redis = "0.24"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tokio-postgres = "0.7"
reqwest = { version = "0.11", features = ["blocking", "json"] }
uuid = { version = "1.0", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
