# cards-alias — wave-7b frontend-prefix alias
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: 54agent-cards-alias-route
  namespace: 54agent
spec:
  ingressClassName: apisix
  http:
    - name: rule-1
      priority: 10
      match:
        hosts:
          - 54agent.upi.dev
          - api.54agent.io
        paths:
          - /cards
          - /cards/*
      backends:
        - serviceName: realtime-transactions
          servicePort: 9548
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri:
              - "^/cards/?$"
              - "/api/v1/cards/customer"
              - "^/cards/list/?$"
              - "/api/v1/cards/customer"
              - "^/cards/(.*)"
              - "/api/v1/cards/$1"
        - name: cors
          enable: true
          config:
            allow_origins: "*"
            allow_methods: "*"
            allow_headers: "*"
            expose_headers: "*"
