apiVersion: v1
kind: Secret
metadata:
  name: {{ include "open-banking-api.fullname" . }}-secrets
type: Opaque
stringData:
{{- range $key, $value := .Values.secrets }}
  {{ $key }}: {{ required (printf "secrets.%s must be set (no default committed; supply via --set or external values file)" $key) $value | quote }}
{{- end }}
