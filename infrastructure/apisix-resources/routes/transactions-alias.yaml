# transactions-alias — wave-7b frontend-prefix alias
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: 54agent-transactions-alias-route
  namespace: 54agent
spec:
  ingressClassName: apisix
  http:
    - name: rule-1
      priority: 10
      match:
        hosts:
          - 54agent.upi.dev
          - api.54agent.io
        paths:
          - /transactions
          - /transactions/*
      backends:
        - serviceName: realtime-transactions
          servicePort: 9553
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri:
              - "^/transactions/?$"
              - "/api/v1/transactions"
              - "^/transactions/list/?$"
              - "/api/v1/transactions"
              - "^/transactions/(.*)"
              - "/api/v1/transactions/$1"
        - name: cors
          enable: true
          config:
            allow_origins: "*"
            allow_methods: "*"
            allow_headers: "*"
            expose_headers: "*"
