# notifications-alias — wave-7b frontend-prefix alias
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: 54agent-notifications-alias-route
  namespace: 54agent
spec:
  ingressClassName: apisix
  http:
    - name: rule-1
      priority: 10
      match:
        hosts:
          - 54agent.upi.dev
          - api.54agent.io
        paths:
          - /notifications
          - /notifications/*
      backends:
        - serviceName: channels-messaging
          servicePort: 9262
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri:
              - "^/notifications/?(.*)"
              - "/api/v1/notifications/$1"
        - name: cors
          enable: true
          config:
            allow_origins: "*"
            allow_methods: "*"
            allow_headers: "*"
            expose_headers: "*"
