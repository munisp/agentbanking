# beneficiaries-alias — wave-7b frontend-prefix alias
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: 54agent-beneficiaries-alias-route
  namespace: 54agent
spec:
  ingressClassName: apisix
  http:
    - name: rule-1
      priority: 10
      match:
        hosts:
          - 54agent.upi.dev
          - api.54agent.io
        paths:
          - /beneficiaries
          - /beneficiaries/*
      backends:
        - serviceName: core-accounts
          servicePort: 9314
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri:
              - "^/beneficiaries/?(.*)"
              - "/api/v1/beneficiaries/$1"
        - name: cors
          enable: true
          config:
            allow_origins: "*"
            allow_methods: "*"
            allow_headers: "*"
            expose_headers: "*"
