[package]
name = "otel-common"
version = "0.1.0"
edition = "2021"
authors = ["54Link Platform Team"]
description = "Shared OpenTelemetry tracing/metrics wiring for 54Link Rust services (Wave-4)"

[dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-opentelemetry = "0.28"
opentelemetry = { version = "0.27", features = ["trace"] }
opentelemetry_sdk = { version = "0.27", features = ["trace", "rt-tokio"] }
opentelemetry-otlp = { version = "0.27", features = ["tonic", "trace"] }
opentelemetry-semantic-conventions = "0.27"
prometheus = "0.13"
once_cell = "1"
http = "1"
