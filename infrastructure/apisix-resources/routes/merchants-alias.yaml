# merchants-alias — frontend-prefix alias (wave-7)
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: 54agent-merchants-alias-route
  namespace: 54agent
spec:
  ingressClassName: apisix
  http:
    - name: rule-1
      priority: 10
      match:
        hosts:
          - 54agent.upi.dev
          - api.54agent.io
        paths:
          - /merchants
          - /merchants/*
      backends:
        - serviceName: realtime-transactions
          servicePort: 9549
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri:
              - "^/merchants/?$"
              - "/merchant/api/v1/merchants"
              - "^/merchants/list/?$"
              - "/merchant/api/v1/merchants"
              - "^/merchants/(.*)"
              - "/merchant/api/v1/merchants/$1"
        - name: cors
          enable: true
          config:
            allow_origins: "*"
            allow_methods: "*"
            allow_headers: "*"
            expose_headers: "*"
