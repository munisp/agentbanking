# =============================================================================
# Grafana dashboards provisioning — Wave-1 canonical stack
# Dashboard JSON files are mounted at /var/lib/grafana/dashboards.
# =============================================================================
apiVersion: 1

providers:
  - name: observability
    orgId: 1
    folder: ''
    folderUid: ''
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
