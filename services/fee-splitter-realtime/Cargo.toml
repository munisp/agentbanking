[package]
name = "fee-splitter-realtime"
version = "1.0.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
sha2 = "0.10"
hex = "0.4"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
tokio = { version = "1", features = ["full"] }
redis = { version = "0.25", features = ["tokio-comp"] }
rdkafka = { version = "0.36", features = ["cmake-build"] }
reqwest = { version = "0.11", features = ["blocking", "json"] }
# tigerbeetle-client = "0.15"  # Not available on crates.io yet
# mojaloop-sdk = "1.0"         # Private/internal SDK
