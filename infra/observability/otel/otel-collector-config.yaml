# =============================================================================
# AgentBanking / POS54 — Canonical OpenTelemetry Collector configuration
# Wave-1 observability stack (infra/observability/)
#
# This file REPLACES the legacy config that exported to an undeployed Jaeger
# endpoint. All middleware scraping, span processing, tenant attribution and
# spanmetrics aggregation happen here; Prometheus scrapes only :8889.
#
# Override any target via environment variables (external infra deployments).
# No secrets in this file: credentials come from env at container start.
# =============================================================================

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Dapr (1.11) uses the Zipkin exporter; dapr config is repointed here.
  zipkin:
    endpoint: 0.0.0.0:9411

  # Scrape every middleware Prometheus endpoint. Job names below are referenced
  # by alert rules in prometheus/rules/middleware.rules.yml — keep in sync.
  prometheus:
    config:
      scrape_configs:
        - job_name: apisix
          scrape_interval: 15s
          static_configs:
            - targets: ["${env:APISIX_METRICS_TARGET:-apisix:9091}"]
          metrics_path: /apisix/prometheus/metrics
        - job_name: keycloak-ha
          # Keycloak 26 HA: metrics on the management port
          scrape_interval: 15s
          static_configs:
            - targets: ["${env:KEYCLOAK_HA_METRICS_TARGET:-keycloak-1:9000}"]
          metrics_path: /metrics
        - job_name: keycloak
          # Root compose Keycloak 24
          scrape_interval: 15s
          static_configs:
            - targets: ["${env:KEYCLOAK_METRICS_TARGET:-keycloak:8080}"]
          metrics_path: /metrics
        - job_name: permify
          scrape_interval: 15s
          static_configs:
            - targets: ["${env:PERMIFY_METRICS_TARGET:-permify:3476}"]
          metrics_path: /metrics
        - job_name: temporal
          # Temporal server prometheus endpoint is :9090, NOT the gRPC :7233
          scrape_interval: 15s
          static_configs:
            - targets: ["${env:TEMPORAL_METRICS_TARGET:-temporal:9090}"]
          metrics_path: /metrics
        - job_name: minio
          # MINIO_PROMETHEUS_AUTH_TYPE=public → no bearer token needed
          scrape_interval: 15s
          static_configs:
            - targets: ["${env:MINIO_METRICS_TARGET:-minio-1:9000}"]
          metrics_path: /minio/v2/metrics/cluster
        - job_name: opensearch
          scrape_interval: 30s
          static_configs:
            - targets: ["${env:OPENSEARCH_METRICS_TARGET:-opensearch-node-1:9200}"]
          metrics_path: /_prometheus/metrics
        - job_name: fluvio
          scrape_interval: 15s
          static_configs:
            - targets: ["${env:FLUVIO_METRICS_TARGET:-fluvio:9003}"]
          metrics_path: /metrics
        - job_name: mojaloop-ml-api
          scrape_interval: 15s
          static_configs:
            - targets: ["${env:MOJALOOP_ML_API_METRICS_TARGET:-ml-api-adapter:3000}"]
          metrics_path: /metrics
        - job_name: mojaloop-account-lookup
          scrape_interval: 15s
          static_configs:
            - targets: ["${env:MOJALOOP_ACCOUNT_LOOKUP_METRICS_TARGET:-account-lookup:4002}"]
          metrics_path: /metrics
        - job_name: mojaloop-central-ledger
          scrape_interval: 15s
          static_configs:
            - targets: ["${env:MOJALOOP_CENTRAL_LEDGER_METRICS_TARGET:-central-ledger-1:3001}"]
          metrics_path: /metrics
        - job_name: mojaloop-central-settlement
          scrape_interval: 15s
          static_configs:
            - targets: ["${env:MOJALOOP_CENTRAL_SETTLEMENT_METRICS_TARGET:-central-settlement:3007}"]
          metrics_path: /metrics
        - job_name: spark
          # PrometheusServlet on the master UI port
          scrape_interval: 15s
          static_configs:
            - targets: ["${env:SPARK_METRICS_TARGET:-spark-master:4040}"]
          metrics_path: /metrics
        - job_name: pos-shell-app
          # TS api-server (prom-client)
          scrape_interval: 15s
          static_configs:
            - targets: ["${env:POS_SHELL_METRICS_TARGET:-app:3000}"]
          metrics_path: /api/metrics
        - job_name: health-checker
          scrape_interval: 15s
          static_configs:
            - targets: ["${env:HEALTH_CHECKER_METRICS_TARGET:-health-checker:8090}"]
          metrics_path: /metrics
        - job_name: circuit-breaker
          scrape_interval: 15s
          static_configs:
            - targets: ["${env:CIRCUIT_BREAKER_METRICS_TARGET:-circuit-breaker:8091}"]
          metrics_path: /metrics
        - job_name: rate-limiter
          scrape_interval: 15s
          static_configs:
            - targets: ["${env:RATE_LIMITER_METRICS_TARGET:-rate-limiter:8092}"]
          metrics_path: /metrics
        - job_name: metrics-collector
          scrape_interval: 15s
          static_configs:
            - targets: ["${env:METRICS_COLLECTOR_METRICS_TARGET:-metrics-collector:8093}"]
          metrics_path: /metrics
        - job_name: postgres-exporter
          # python exporter for postgres-production (distinct from the
          # postgresql receiver below, which reads pg stats directly)
          scrape_interval: 30s
          static_configs:
            - targets: ["${env:POSTGRES_EXPORTER_METRICS_TARGET:-postgres-production:9090}"]
          metrics_path: /metrics
        - job_name: papss
          scrape_interval: 15s
          static_configs:
            - targets: ["${env:PAPSS_METRICS_TARGET:-papss:8081}"]
          metrics_path: /metrics
        # NOTE: TigerBeetle 0.16.43 exposes NO metrics endpoint — documented gap.
        # Availability is covered by the tigerbeetle-sidecar up{} alert once a
        # sidecar/heartbeat exporter exists; do not invent a scrape here.

  # Kafka is KRaft with no JMX exporter → use the kafkametrics receiver.
  kafkametrics:
    brokers: ["${env:KAFKA_BROKERS:-kafka:9092}"]
    protocol_version: 2.0.0
    scrapers:
      - brokers
      - topics
      - consumers

  postgresql:
    endpoint: "${env:POSTGRES_ENDPOINT:-postgres:5432}"
    transport: tcp
    username: "${env:POSTGRES_USER:-postgres}"
    password: "${env:POSTGRES_PASSWORD}"
    databases:
      - postgres
    tls:
      insecure: true
    collection_interval: 30s

  redis:
    endpoint: "${env:REDIS_ENDPOINT:-redis:6379}"
    collection_interval: 30s

  hostmetrics:
    collection_interval: 30s
    scrapers:
      cpu:
      memory:
      disk:
      load:
      network:

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

  batch:
    timeout: 5s
    send_batch_size: 1024

  resourcedetection:
    detectors: [env, system]
    timeout: 5s
    override: false

  # Copy span attribute tenant.id onto the resource so downstream
  # (Tempo index, spanmetrics dimensions) can group by tenant.
  # Defaults to 'unknown' when the span carries no tenant.id.
  transform/tenant:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - set(resource.attributes["tenant.id"], attributes["tenant.id"]) where attributes["tenant.id"] != nil
          - set(resource.attributes["tenant.id"], "unknown") where attributes["tenant.id"] == nil

  # Redact sensitive attributes before anything leaves the collector.
  attributes/redact:
    actions:
      - key: authorization
        action: delete
      - key: password
        action: delete
      - key: secret
        action: delete
      - key: token
        action: delete

connectors:
  # Aggregate RED metrics from spans. Explicit (non-exponential) histogram
  # buckets chosen for payments-domain latency SLOs.
  # NOTE: dimension names containing dots are sanitized to underscores in the
  # Prometheus export: `tenant.id` becomes the label `tenant_id`,
  # `http.status_code` becomes `http_status_code`. `service_name` is emitted
  # automatically by the connector.
  spanmetrics:
    histogram:
      explicit:
        buckets: [2ms, 10ms, 50ms, 100ms, 250ms, 500ms, 1s, 2.5s, 5s, 10s]
    dimensions:
      - name: tenant.id
      - name: http.status_code

exporters:
  # Aggregated middleware + spanmetrics feed scraped by Prometheus.
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: pos54
    resource_to_telemetry_conversion:
      enabled: true

  otlp/tempo:
    endpoint: "${env:TEMPO_ENDPOINT:-tempo:4317}"
    tls:
      insecure: true

  loki:
    endpoint: "${env:LOKI_ENDPOINT:-http://loki:3100/loki/api/v1/push}"

  debug:
    verbosity: basic
    sampling_initial: 2
    sampling_thereafter: 50

service:
  pipelines:
    traces:
      receivers: [otlp, zipkin]
      processors: [memory_limiter, resourcedetection, transform/tenant, attributes/redact, batch]
      exporters: [otlp/tempo, spanmetrics, debug]
    metrics:
      receivers: [otlp, prometheus, kafkametrics, postgresql, redis, hostmetrics, spanmetrics]
      processors: [memory_limiter, batch]
      exporters: [prometheus, debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [loki, debug]
