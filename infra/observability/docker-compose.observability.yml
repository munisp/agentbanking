# =============================================================================
# AgentBanking / POS54 — Canonical observability stack (Wave-1)
#
# Full stack: otel-collector + tempo + prometheus + alertmanager + grafana +
# loki + ntfy. Host ports are deliberately distinct from the root compose
# `monitoring` profile (prometheus 9090, grafana 3001) to avoid collisions:
#   prometheus 19090 | grafana 13000 | tempo 13200 | alertmanager 19093
#   loki 13100 | ntfy 18080
# Internal container ports remain standard.
#
# Joins the shared compose network created by the root compose:
#   54link-network (bridge)
#
# Required env at deploy time (fail-closed where marked):
#   GRAFANA_ADMIN_PASSWORD  (required, no default)
#   POSTGRES_PASSWORD       (required by the collector postgresql receiver)
# Optional overrides: all *_METRICS_TARGET vars, TEMPO_ENDPOINT, LOKI_ENDPOINT,
# KAFKA_BROKERS, POSTGRES_ENDPOINT, POSTGRES_USER, REDIS_ENDPOINT, SMTP_*,
# NTFY_TOKEN_* — see the collector / alertmanager configs.
# =============================================================================

networks:
  default:
    name: 54link-network

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.129.0
    container_name: obs-otel-collector
    command: ["--config=/etc/otelcol-contrib/otel-collector-config.yaml"]
    volumes:
      - ./otel/otel-collector-config.yaml:/etc/otelcol-contrib/otel-collector-config.yaml:ro
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_ENDPOINT: ${POSTGRES_ENDPOINT:-postgres:5432}
      REDIS_ENDPOINT: ${REDIS_ENDPOINT:-redis:6379}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      TEMPO_ENDPOINT: ${TEMPO_ENDPOINT:-tempo:4317}
      LOKI_ENDPOINT: ${LOKI_ENDPOINT:-http://loki:3100/loki/api/v1/push}
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # aggregated prometheus exporter (scraped by prometheus)
      - "9411:9411"   # zipkin receiver (Dapr 1.11 repoint target)
    depends_on:
      - tempo
      - loki
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:13133/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.8.0
    container_name: obs-tempo
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "13200:3200"  # tempo http/query API
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3200/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: obs-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prom-data:/prometheus
    ports:
      - "19090:9090"
    depends_on:
      - otel-collector
      - alertmanager
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: obs-alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "19093:9093"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9093/-/healthy || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.1
    container_name: obs-grafana
    environment:
      # fail-closed: no default admin password
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "13000:3000"
    depends_on:
      - prometheus
      - tempo
      - loki
      - alertmanager
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  loki:
    image: grafana/loki:3.2.1
    container_name: obs-loki
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      # Existing in-repo loki config (recon: infra/loki/loki-config.yaml)
      - ../loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/var/loki
    ports:
      - "13100:3100"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  ntfy:
    image: binwiederhier/ntfy:v2.11.0
    container_name: obs-ntfy
    command: ["serve"]
    ports:
      - "18080:80"
    restart: unless-stopped

volumes:
  tempo-data:
  prom-data:
  grafana-data:
  loki-data:
