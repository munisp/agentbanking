###############################################################################
# Spark 3.5 Metrics — PrometheusServlet sink (POS-54Link Lakehouse)
#
# Usage:
#   1. Mount this file into every Spark container, e.g.
#      - ./infra/lakehouse/spark/metrics.properties:/opt/spark/conf/metrics.properties
#   2. Point Spark at it:  spark.metrics.conf=/opt/spark/conf/metrics.properties
#      (SPARK_METRICS_CONF env or --conf spark.metrics.conf=...)
#   3. Scrape spark-master:4040/metrics/prometheus (executor/driver metrics are
#      aggregated through the PrometheusServlet on the driver/master UI port).
#
# Note (Sedona): Apache Sedona runs as a Spark library/plugin, not a standalone
# service — it exposes NO separate metrics endpoint; its work is covered by the
# Spark driver/executor sources below.
###############################################################################

# Enable the Prometheus servlet sink for all instances
*.sink.prometheusServlet.class=org.apache.spark.metrics.sink.PrometheusServlet
*.sink.prometheusServlet.path=/metrics/prometheus

# JVM-level metrics (heap, GC, threads) on every Spark instance
*.source.jvm.class=org.apache.spark.metrics.source.JvmSource

# Driver-side sources (app progress, DAG scheduler, block manager)
driver.source.jvm.class=org.apache.spark.metrics.source.JvmSource

# Executor-side sources
executor.source.jvm.class=org.apache.spark.metrics.source.JvmSource

# Standalone master / worker sources (spark-master bitnami/spark:3.5)
master.source.jvm.class=org.apache.spark.metrics.source.JvmSource
worker.source.jvm.class=org.apache.spark.metrics.source.JvmSource
