# qr-alias — frontend-prefix alias (wave-7)
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: 54agent-qr-alias-route
  namespace: 54agent
spec:
  ingressClassName: apisix
  http:
    - name: rule-1
      priority: 10
      match:
        hosts:
          - 54agent.upi.dev
          - api.54agent.io
        paths:
          - /qr
          - /qr/*
      backends:
        - serviceName: core-payments
          servicePort: 9361
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri:
              - "^/qr/?$"
              - "/api/v1/qr-code-service"
              - "^/qr/list/?$"
              - "/api/v1/qr-code-service"
              - "^/qr/(.*)"
              - "/api/v1/qr-code-service/$1"
        - name: cors
          enable: true
          config:
            allow_origins: "*"
            allow_methods: "*"
            allow_headers: "*"
            expose_headers: "*"
