# wallet-alias — wave-7 frontend-prefix alias
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: 54agent-wallet-alias-route
  namespace: 54agent
spec:
  ingressClassName: apisix
  http:
    - name: rule-1
      priority: 10
      match:
        hosts:
          - 54agent.upi.dev
          - api.54agent.io
        paths:
          - /wallet/*
      backends:
        - serviceName: core-accounts
          servicePort: 9317
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri:
              - "^/wallet/(.*)"
              - "/$1"
        - name: cors
          enable: true
          config:
            allow_origins: "*"
            allow_methods: "*"
            allow_headers: "*"
            expose_headers: "*"
