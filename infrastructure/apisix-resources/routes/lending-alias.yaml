# lending-alias — frontend-prefix alias (wave-7)
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: 54agent-lending-alias-route
  namespace: 54agent
spec:
  ingressClassName: apisix
  http:
    - name: rule-1
      priority: 10
      match:
        hosts:
          - 54agent.upi.dev
          - api.54agent.io
        paths:
          - /lending
          - /lending/*
      backends:
        - serviceName: lending-credit
          servicePort: 9524
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri:
              - "^/lending/?$"
              - "/applications"
              - "^/lending/list/?$"
              - "/applications"
              - "^/lending/(.*)"
              - "/applications/$1"
        - name: cors
          enable: true
          config:
            allow_origins: "*"
            allow_methods: "*"
            allow_headers: "*"
            expose_headers: "*"
